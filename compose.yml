name: sql-automation-next

services:
  connection-service:
    image: sql-automation-next-connection-service:dev
    build:
      context: .
      dockerfile: services/SqlAutomation.ConnectionService/Dockerfile
    ports:
      - "${CONNECTION_SERVICE_PORT:-5090}:8080"
    networks:
      - app-network

  gateway:
    image: sql-automation-next-gateway:dev
    build:
      context: .
      dockerfile: gateway/SqlAutomation.Gateway/Dockerfile
    environment:
      ReverseProxy__Clusters__connections__Destinations__primary__Address: http://connection-service:8080/
    ports:
      - "${GATEWAY_PORT:-5080}:8080"
    depends_on:
      - connection-service
    networks:
      - app-network

  client:
    image: sql-automation-next-client:dev
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${CLIENT_PORT:-5173}:8080"
    depends_on:
      - gateway
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
